[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokewatch"
version = "0.2.0"
description = "Pokémon TCG release & restock monitoring agent (notification-only, no purchasing)."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "plotly>=5.20", "pandas>=2.2"]
postgres = ["psycopg[binary]>=3.1"]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
pokewatch = "pokewatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
