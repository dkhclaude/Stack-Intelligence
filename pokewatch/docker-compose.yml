# Production-style stack: Postgres + monitoring worker + dashboard + nightly backups.
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f worker
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokewatch
      POSTGRES_USER: pokewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokewatch"]
      interval: 10s
      retries: 10

  worker:
    build: .
    command: ["pokewatch", "worker"]
    restart: unless-stopped          # restarts on crash and after reboot
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pokewatch:${POSTGRES_PASSWORD}@db:5432/pokewatch
    depends_on:
      db: {condition: service_healthy}
    healthcheck:                      # unhealthy if no heartbeat for ~4 minutes
      test: ["CMD", "pokewatch", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pokewatch:${POSTGRES_PASSWORD}@db:5432/pokewatch
    depends_on:
      db: {condition: service_healthy}
    # Bound to localhost: reach it through an SSH tunnel or Tailscale, not the open internet.
    ports:
      - "127.0.0.1:8501:8501"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/backups:/backups
    depends_on:
      db: {condition: service_healthy}
    # Nightly compressed dump; keeps the 14 newest files.
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U pokewatch pokewatch | gzip > /backups/pokewatch-$$(date +%F).sql.gz
          ls -1t /backups/*.sql.gz | tail -n +15 | xargs -r rm --
          sleep 86400
        done

volumes:
  pgdata:
